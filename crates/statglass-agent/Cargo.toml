[package]
name = "statglass-agent"
description = "Headless StatGlass agent: samples this host into its own history and serves it over SSH stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
statglass-engine.workspace = true
statglass-proto.workspace = true
statglass-remote.workspace = true
statglass-update.workspace = true
statglass-schema.workspace = true
statglass-store.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
rustix = { workspace = true, features = ["process"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util", "process"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
