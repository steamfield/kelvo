[package]
name = "statglass-cli"
description = "The statglass command-line tool: asks the running app over its query socket, never reads storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The app's own executable is already `statglass`; this one ships beside it as
# `Contents/MacOS/statglass-cli` and is linked onto PATH as `statglass`.
[[bin]]
name = "statglass-cli"
path = "src/main.rs"

[dependencies]
statglass-query.workspace = true
statglass-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
