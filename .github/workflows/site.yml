name: Site

# Deploys docs-site/ to Cloudflare Pages (project `statglass`, served at
# https://statglass.steamfield.io) when main changes in a way that changes the
# site. The site renders the app's own widgets and embeds the app built on its
# mock transport, so app sources count as site sources too.
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; a newer push waits and deploys after it.
concurrency:
  group: site-deploy
  cancel-in-progress: false

# Hosted CI uses Linux only (D-118).
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # After setup-bun so real node outranks ~/.bun/bin in PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-site-linux-${{ hashFiles('bun.lock', 'docs-site/bun.lock') }}
          restore-keys: |
            bun-site-linux-

      - name: Install dependencies
        run: make -C docs-site install

      - name: Lint, check and test
        run: make -C docs-site lint check test

      - name: Build
        run: make -C docs-site build
        env:
          # Empty leaves analytics off (src/lib/analytics.ts).
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}

      - name: Deploy to Cloudflare Pages
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34ff6ad3262f4b00980f29ca3a540ed6
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret (a token with Account > Cloudflare Pages > Edit)."
            exit 1
          fi
          bunx wrangler@4.156.1 pages deploy dist \
            --project-name=statglass \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$(git log -1 --format=%s)"
